---
version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task -l

  apps:list:
    desc: List image apps
    silent: true
    cmds:
      - find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort

  apps:print:
    desc: Print the Docker Bake plan for an app
    requires:
      vars:
        - APP
    dir: apps/{{.APP}}
    cmds:
      - docker buildx bake --print image-local

  apps:build:
    desc: Build an app locally with Docker Bake
    requires:
      vars:
        - APP
    dir: apps/{{.APP}}
    cmds:
      - docker buildx bake image-local

  apps:smoke:
    desc: Build an app and run its smoke check
    requires:
      vars:
        - APP
    cmds:
      - task: apps:build
        vars:
          APP: "{{.APP}}"
      - docker run --rm {{.APP}}:local --help
      - |
        cid="$(docker run -d \
          -p 127.0.0.1:8080:8080 \
          -e SEERR_URL=http://example.invalid \
          -e SEERR_API_KEY=dummy \
          -e MCP_API_KEY=dummy \
          {{.APP}}:local)"
        trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8080/health; then
            exit 0
          fi
          sleep 1
        done
        docker logs "${cid}" >&2
        exit 1
